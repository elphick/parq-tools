name: "Build and Publish Docs to GitHub Pages"
on:
  push:
    paths:
      - 'examples/*.py'
      - 'docs/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/docs_to_gh_pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/*.py'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/docs_to_gh_pages.yml'
  workflow_dispatch:

permissions:
    contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          python-version: "3.13"
          enable-cache: true

      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@v3

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Sphinx build
        run: |
          uv run --locked --all-extras sphinx-build docs _build

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/
          force_orphan: true
