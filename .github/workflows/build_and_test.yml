name: "Run Tests with uv"

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ,"3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Test with pytest
        run: uv run --locked --all-extras pytest
          
  coverage-badge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          python-version: "3.13"
          enable-cache: true
  
      - name: Install dependencies
        run: uv sync --locked --all-extras
  
      - name: Generate coverage report
        run: |
          uv run --locked --all-extras coverage run -m pytest
          uv run --locked --all-extras coverage xml
  
      - name: Generate coverage badge
        run: uv run --locked --all-extras coverage-badge -o badges/coverage.svg -f
  
      - name: Ensure destination directory and copy badge
        run: |
          mkdir -p docs/source/_static/badges
          cp badges/coverage.svg docs/source/_static/badges/coverage.svg
  
      - name: Upload coverage badge
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: docs/source/_static/badges/coverage.svg
  
      - name: Commit and push coverage badge
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/source/_static/badges/coverage.svg
          git commit -m "Update coverage badge [skip ci]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
