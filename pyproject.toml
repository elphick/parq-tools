[project]
name = "parq-tools"
version = "0.5.4"
description = "A collection of utilities for efficiently working with **large-scale** Parquet datasets."
authors = [{ name = "Greg", email = "11791585+elphick@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyarrow>=16.0",
    "lark>=1.2.2,<2",
    "tqdm>=4.67.1",
    "pandas>=2.0",
]

[project.optional-dependencies]
profiling = [
    "fg-data-profiling>=4.19.1,<5",
    "setuptools<81",  # Still needed by fg-data-profiling.
]
blockmodel = ["pyvista>=0.45.2"]

[dependency-groups]
dev = [
    "pytest>=8.2.1,<9",
    "sphinx>=7.3.7,<8",
    "sphinx-gallery>=0.16.0,<0.17",
    "sphinx-rtd-theme>=2.0.0,<3",
    "myst-parser>=3.0.1,<4",
    "sphinx-autodoc-typehints>=2.1.1,<3",
    "matplotlib>=3.7.2,<4",
    "coverage>=7.8.0,<8",
    "coverage-badge>=1.1.2,<2",
]


[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "slow: marks tests as slow and requiring data profiling (deselect with '-m \"not slow\"')",
    "performance: marks tests for performance benchmarking",
]


[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parq_tools"]
